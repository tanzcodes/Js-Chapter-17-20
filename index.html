<!DOCTYPE html>
<html>
<head>
    <title>Series Program</title>
    <script src="./app.js"></script>
</head>
<body>


  <h3>Counting:</h3>

<script>
for (let i = 1; i <= 15; i++) {
    document.write(i + ", ");
}
document.write("<br><br>");

document.write("<h3>Reverse Counting:</h3>");
for (let i = 10; i >= 1; i--) {
    document.write(i + ", ");
}
document.write("<br><br>");

document.write("<h3>Even Numbers:</h3>");
for (let i = 0; i <= 20; i++) {
    if (i % 2 === 0) {
        document.write(i + ", ");
    }
}
document.write("<br><br>");

document.write("<h3>Odd Numbers:</h3>");
for (let i = 1; i <= 19; i++) {
    if (i % 2 !== 0) {
        document.write(i + ", ");
    }
}
document.write("<br><br>");

document.write("<h3>Series:</h3>");
for (let i = 2; i <= 20; i += 2) {
    document.write(i + "k, ");
}
</script> 

</body>
</html>
